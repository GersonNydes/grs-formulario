<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<title>GRS Automações — Cadastro de Cliente</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:#f4f4f5;min-height:100vh;padding:28px 16px 60px}
.wrap{max-width:580px;margin:0 auto}
.header{text-align:center;margin-bottom:28px}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:6px}
.logo-mark{width:38px;height:38px;background:#111827;border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:22px;height:22px}
.logo-name{font-size:18px;font-weight:800;color:#111827;letter-spacing:-0.3px}
.logo-sub{display:block;font-size:11px;font-weight:500;color:#9ca3af;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.header-desc{font-size:13px;color:#6b7280;margin-top:8px}
/* Progress */
.prog-wrap{margin-bottom:20px}
.prog-steps{display:flex;align-items:center}
.ps{display:flex;align-items:center;flex:1}
.ps-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .25s}
.ps-dot.done{background:#111827;color:#fff}
.ps-dot.active{background:#2563eb;color:#fff;box-shadow:0 0 0 3px #bfdbfe}
.ps-dot.pending{background:#fff;border:2px solid #e5e7eb;color:#9ca3af}
.ps-line{flex:1;height:1px;background:#e5e7eb;transition:background .25s}
.ps-line.done{background:#111827}
.prog-labels{display:flex;margin-top:6px}
.pl{flex:1;font-size:10px;font-weight:600;color:#9ca3af;text-align:center;transition:color .25s}
.pl.active{color:#2563eb}.pl.done{color:#374151}
/* Type selection */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-card{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:18px 16px;cursor:pointer;transition:all .2s;text-align:left;position:relative}
.type-card:hover{border-color:#d1d5db;box-shadow:0 4px 16px rgba(0,0,0,.07);transform:translateY(-1px)}
.type-card.sel{border-color:#2563eb;background:#eff6ff}
.type-card.sel .tc-check{display:flex}
.tc-check{display:none;position:absolute;top:10px;right:10px;width:20px;height:20px;background:#2563eb;border-radius:50%;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:800}
.tc-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px}
.tc-name{font-size:14px;font-weight:700;color:#111827;margin-bottom:3px}
.type-card.sel .tc-name{color:#1d4ed8}
.tc-desc{font-size:11px;color:#9ca3af;line-height:1.4}
/* Card */
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-bottom:16px}
.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f3f4f6}
.card-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.card-title{font-size:16px;font-weight:700;color:#111827}
.card-sub{font-size:12px;color:#9ca3af;margin-top:1px}
/* Fields */
.f{margin-bottom:15px}.f:last-child{margin-bottom:0}
.fl{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;letter-spacing:.1px}
.req{color:#2563eb}
input,textarea,select{width:100%;padding:10px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:13.5px;font-family:inherit;color:#111827;background:#fff;outline:none;transition:border .15s,box-shadow .15s;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
textarea{resize:vertical;line-height:1.5}
.hint{font-size:11px;color:#9ca3af;margin-top:4px;line-height:1.4}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.chip{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;border:1.5px solid #e5e7eb;cursor:pointer;transition:all .15s;background:#fff;color:#6b7280;user-select:none}
.chip:hover:not(.on){border-color:#93c5fd;color:#2563eb}
.chip.on{background:#2563eb;border-color:#2563eb;color:#fff}
/* Toggle */
.tog{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;border:1.5px solid #e5e7eb;cursor:pointer;font-size:12.5px;font-weight:600;color:#374151;background:#fff;transition:all .15s;user-select:none}
.tog.on{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
.tog-box{width:15px;height:15px;border-radius:4px;border:1.5px solid #d1d5db;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.tog.on .tog-box{background:#2563eb;border-color:#2563eb}
.tog.on .tog-box::after{content:'✓';font-size:9px;color:#fff;font-weight:800}
/* Note */
.note{background:#f8fafc;border-left:3px solid #2563eb;border-radius:0 10px 10px 0;padding:12px 14px;font-size:12.5px;color:#374151;margin-bottom:15px;line-height:1.5}
.note b{color:#111827}.note.warn{border-color:#f59e0b;background:#fffbeb;color:#92400e}
.note.green{border-color:#059669;background:#f0fdf4;color:#065f46}
/* Input+btn */
.inpbtn{display:flex;gap:8px}
.inpbtn input{flex:1}
.sbtn{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:10px 13px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;font-size:12px;font-weight:700;color:#2563eb;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
.sbtn:hover{background:#eff6ff;border-color:#93c5fd}
/* Team / FAQ */
.dyn-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dyn-item{display:flex;gap:8px;align-items:flex-start}
.dyn-fields{flex:1;display:flex;flex-direction:column;gap:6px}
.rm-btn{width:32px;height:38px;border:1.5px solid #e5e7eb;border-radius:9px;background:#fff;cursor:pointer;color:#9ca3af;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:0;transition:all .15s;font-family:inherit;line-height:1}
.rm-btn:hover{background:#fef2f2;border-color:#fca5a5;color:#ef4444}
.add-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px dashed #d1d5db;border-radius:9px;background:transparent;font-size:12.5px;font-weight:600;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s;width:fit-content}
.add-btn:hover{border-color:#93c5fd;color:#2563eb}
.faq-pair{background:#f8fafc;border-radius:10px;padding:10px;border:1px solid #f1f5f9}
.faq-pair .faq-label{font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:4px}
/* Section divider inside card */
.sdiv{border-top:1px solid #f3f4f6;margin:18px 0;padding-top:18px}
.slabel{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.6px;text-transform:uppercase;margin-bottom:12px}
/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center}
.btn-b{display:flex;align-items:center;gap:5px;padding:10px 18px;border:1.5px solid #e5e7eb;border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;color:#374151;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-b:hover{background:#f9fafb}
.btn-b:disabled{opacity:0;pointer-events:none}
.btn-n{display:flex;align-items:center;gap:6px;padding:11px 24px;border:none;border-radius:11px;background:#2563eb;font-size:13.5px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-n:hover{background:#1d4ed8}
.btn-n:disabled{opacity:.6;pointer-events:none}
.sc{font-size:12px;color:#9ca3af;text-align:center;margin-top:12px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mod{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mt{font-size:15px;font-weight:800;color:#111827}
.mcl{width:28px;height:28px;border:1.5px solid #e5e7eb;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#6b7280;font-family:inherit}
.si{display:flex;gap:12px;margin-bottom:14px}
.sn{width:24px;height:24px;border-radius:50%;background:#111827;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.st{font-size:13px;font-weight:700;color:#111827}
.sd{font-size:12px;color:#6b7280;margin-top:2px;line-height:1.4}
.mlink{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;background:#2563eb;color:#fff;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none;margin-top:16px;transition:background .15s}
.mlink:hover{background:#1d4ed8}
/* Success */
.suc{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:40px 28px;text-align:center}
.suc-ic{width:64px;height:64px;background:#eff6ff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.suc h2{font-size:21px;font-weight:800;color:#111827;margin-bottom:8px}
.suc p{font-size:13.5px;color:#6b7280;line-height:1.6;margin-bottom:22px}
.ns{background:#f9fafb;border-radius:14px;padding:18px;text-align:left}
.ns-t{font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:.4px;text-transform:uppercase;margin-bottom:12px}
.ns-i{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;font-size:13px;color:#374151;line-height:1.4}
.ns-n{width:22px;height:22px;border-radius:50%;background:#111827;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="8.5" r="3.5" stroke="white" stroke-width="1.6"/>
        <path d="M3 19.5c0-4.142 3.582-7.5 8-7.5s8 3.358 8 7.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M17.5 3.5L19 2M4.5 3.5L3 2M11 2.5V1" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <span class="logo-name">GRS Automações</span>
      <span class="logo-sub">Assistentes Virtuais para Negócios</span>
    </div>
  </div>
  <p class="header-desc">Preencha o formulário para ativar seu assistente de WhatsApp 24h</p>
</div>

<div class="prog-wrap" id="progWrap" style="display:none">
  <div class="prog-steps" id="progSteps"></div>
  <div class="prog-labels" id="progLabels"></div>
</div>

<div id="content"></div>

<div class="nav" id="nav" style="display:none">
  <button class="btn-b" id="btnB" onclick="go(-1)">← Anterior</button>
  <button class="btn-n" id="btnN" onclick="go(1)">Próximo →</button>
</div>
<div class="sc" id="sc"></div>
</div>

<div class="ov" id="modal" style="display:none">
  <div class="mod">
    <div class="mh"><span class="mt" id="mTitle"></span><button class="mcl" onclick="closeM()">✕</button></div>
    <div id="mBody"></div>
    <a href="https://cal.com" target="_blank" class="mlink">🔗 Abrir Cal.com em nova aba</a>
  </div>
</div>

<script>
const TUTS={
  api:{title:'Como obter a API Key do Cal.com',steps:[
    {t:'Faça login no Cal.com',d:'Acesse cal.com e entre na sua conta.'},
    {t:'Settings → Developer',d:'No menu lateral, clique em "Settings" e depois em "Developer".'},
    {t:'API Keys → Create new key',d:'Clique em "API Keys" e depois em "+ Create new key".'},
    {t:'Copie a chave gerada',d:'Dê um nome (ex: "Bot GRS"), crie e copie o valor imediatamente. Ele aparece apenas uma vez.'}
  ]},
  eid:{title:'Como encontrar o Event Type ID',steps:[
    {t:'Acesse Event Types no Cal.com',d:'No menu lateral, clique em "Event Types".'},
    {t:'Crie ou edite um tipo de evento',d:'Ex: "Consulta - 30 min" ou "Corte de Cabelo".'},
    {t:'Encontre o ID na URL',d:'Ao editar, a URL mostra: /event-types/123/edit — o número (123) é seu Event Type ID.'}
  ]}
};

const TYPES={
  barbearia:{icon:'✂️',color:'#7f1d1d',bg:'#fef2f2',name:'Barbearia',desc:'Barbearia, salão masculino, estética',steps:['Negócio','Equipe','Serviços','Horários','Agendamento','Agente','Contato']},
  ecommerce:{icon:'🛍️',color:'#4c1d95',bg:'#f5f3ff',name:'E-commerce',desc:'Loja virtual, vendas por WhatsApp',steps:['Negócio','Produtos','Logística','Pagamento','Políticas','Agente','Contato']},
  clinica:{icon:'🏥',color:'#0c4a6e',bg:'#f0f9ff',name:'Clínica / Consultório',desc:'Médica, odontológica, fisioterapia',steps:['Negócio','Horários','Serviços','Agendamento','Agente','Contato']},
  advocacia:{icon:'⚖️',color:'#78350f',bg:'#fffbeb',name:'Advocacia',desc:'Escritório jurídico e consultoria',steps:['Negócio','Áreas','Horários','Agendamento','Agente','Contato']}
};

const DIAS_F=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const DIAS_S=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const PAGTOS=['PIX','Débito','Crédito','Dinheiro','Boleto'];
const AREAS=['Família','Trabalhista','Cível','Criminal','Empresarial','Consumidor','Tributário','Previdenciário','Imobiliário','Contratos'];

let sel=null, step=0;
let prof=[{n:'',s:''}];
let faqs=[{q:'',a:''},{q:'',a:''}];
let form={
  nomeNeg:'',end:'',wa:'',insta:'',site:'',especialidade:'Odontologia',oab:'',advPrincipal:'',
  dias:['Segunda','Terça','Quarta','Quinta','Sexta'],abr:'08:00',fec:'18:00',obsHor:'',
  servicos:'',precos:'',convenios:'',pagtos:['PIX','Débito'],priGrat:false,obsServ:'',linkCatalogServ:'',
  produtos:'',destaque:'',faixaPreco:'',comoCompra:'',
  prazoEntrega:'',freteGratis:'',regioes:'',transportadoras:'',
  parcelamento:'',pixDesconto:false,
  politicaTroca:'',garantia:'',cancelamento:'',
  areasDir:[],obsAreas:'',consultaIni:false,
  calKey:'',calEid:'',duracao:'30',tipoConsulta:'Consulta',
  nomeAg:'',tom:'',diferencial:'',naoFazer:'',instrucoes:'',boasvindas:'',
  tabelaPrecos:'',linkCatalogo:'',
  palavrasHumano:'urgência, emergência, falar com alguém',
  respNome:'',respWa:'',respEmail:'',obsFinais:''
};

function u(f,v){form[f]=v;}
function tv(f){form[f]=!form[f];render();}
function toggleChip(f,v){const i=form[f].indexOf(v);if(i>-1)form[f].splice(i,1);else form[f].push(v);render();}
function addProf(){prof.push({n:'',s:''});render();}
function rmProf(i){if(prof.length>1){prof.splice(i,1);render();}}
function updProf(i,field,v){prof[i][field]=v;}
function addFaq(){if(faqs.length<7)faqs.push({q:'',a:''});render();}
function rmFaq(i){if(faqs.length>1){faqs.splice(i,1);render();}}
function updFaq(i,field,v){faqs[i][field]=v;}
function openM(k){const t=TUTS[k];document.getElementById('mTitle').textContent=t.title;document.getElementById('mBody').innerHTML=t.steps.map((s,i)=>`<div class="si"><div class="sn">${i+1}</div><div><div class="st">${s.t}</div><div class="sd">${s.d}</div></div></div>`).join('');document.getElementById('modal').style.display='flex';}
function closeM(){document.getElementById('modal').style.display='none';}

function selectType(t){sel=t;step=1;form.tom=t==='barbearia'?'Descontraído e informal':t==='ecommerce'?'Consultivo e amigável':t==='advocacia'?'Profissional e formal':'Amigável e acolhedor';render();}

function renderProgress(){
  if(!sel){document.getElementById('progWrap').style.display='none';return;}
  document.getElementById('progWrap').style.display='block';
  const steps=TYPES[sel].steps;const si=step-1;
  document.getElementById('progSteps').innerHTML=steps.map((s,i)=>{const cls=i<si?'done':i===si?'active':'pending';const line=i<steps.length-1?`<div class="ps-line ${i<si?'done':''}"></div>`:'';return `<div class="ps"><div class="ps-dot ${cls}">${i<si?'✓':(i+1)}</div>${line}</div>`;}).join('');
  document.getElementById('progLabels').innerHTML=steps.map((s,i)=>{const cls=i<si?'done':i===si?'active':'';return `<span class="pl ${cls}" style="font-size:9px">${s}</span>`;}).join('');
}

function renderNav(){
  const nav=document.getElementById('nav');const sc=document.getElementById('sc');
  if(!sel){nav.style.display='none';sc.textContent='';return;}
  nav.style.display='flex';
  const steps=TYPES[sel].steps;
  document.getElementById('btnB').disabled=(step<=1);
  document.getElementById('btnN').textContent=step>=steps.length?'✨ Enviar Cadastro →':'Próximo →';
  sc.textContent=`Etapa ${step} de ${steps.length}`;
}

function renderContent(){
  const el=document.getElementById('content');
  if(!sel){
    el.innerHTML=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#f4f4f5">🎯</div><div><div class="card-title">Tipo de Negócio</div><div class="card-sub">Selecione o perfil que melhor descreve seu negócio</div></div></div>
    <div class="type-grid">${Object.entries(TYPES).map(([k,t])=>`<div class="type-card ${sel===k?'sel':''}" onclick="selectType('${k}')"><div class="tc-check">✓</div><div class="tc-icon" style="background:${t.bg}">${t.icon}</div><div class="tc-name">${t.name}</div><div class="tc-desc">${t.desc}</div></div>`).join('')}</div></div>`;
    return;
  }

  const t=TYPES[sel];const stepName=t.steps[step-1];let html='';

  if(stepName==='Negócio'){
    const extra=sel==='advocacia'?`<div class="f"><label class="fl">Nome do Advogado Principal <span class="req">*</span></label><input placeholder="Dr. João Silva" value="${form.advPrincipal}" oninput="u('advPrincipal',this.value)"/></div><div class="f"><label class="fl">Número da OAB</label><input placeholder="Ex: SP 123456" value="${form.oab}" oninput="u('oab',this.value)"/></div>`:sel==='clinica'?`<div class="f"><label class="fl">Especialidade <span class="req">*</span></label><select onchange="u('especialidade',this.value)">${['Odontologia','Clínica Geral','Fisioterapia','Dermatologia','Cardiologia','Psicologia','Nutrição','Ginecologia','Ortopedia','Estética','Outro'].map(e=>`<option ${form.especialidade===e?'selected':''}>${e}</option>`).join('')}</select></div>`:sel==='barbearia'?`<div class="f"><label class="fl">Instagram</label><input placeholder="@suabarbearia" value="${form.insta}" oninput="u('insta',this.value)"/></div>`:`<div class="f"><label class="fl">Link da Loja / Catálogo</label><input placeholder="https://sualoja.com.br" value="${form.site}" oninput="u('site',this.value)"/></div><div class="f"><label class="fl">Instagram</label><input placeholder="@sualojavirtual" value="${form.insta}" oninput="u('insta',this.value)"/></div>`;
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:${t.bg}">${t.icon}</div><div><div class="card-title">Dados do Negócio</div><div class="card-sub">${t.name}</div></div></div>
    <div class="f"><label class="fl">Nome do Negócio <span class="req">*</span></label><input placeholder="Ex: Barbearia do João" value="${form.nomeNeg}" oninput="u('nomeNeg',this.value)"/></div>
    ${extra}
    <div class="f"><label class="fl">Endereço Completo</label><input placeholder="Rua, número, bairro, cidade/UF" value="${form.end}" oninput="u('end',this.value)"/></div>
    <div class="f"><label class="fl">WhatsApp <span class="req">*</span></label><input placeholder="5515999999999 (DDI+DDD, sem espaços)" value="${form.wa}" oninput="u('wa',this.value)"/><div class="hint">Número que o bot vai atender. Inclua 55 no início, sem espaços ou traços.</div></div></div>`;
  }

  else if(stepName==='Equipe'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#fef2f2">👥</div><div><div class="card-title">Equipe de Profissionais</div><div class="card-sub">Informe os barbeiros / profissionais</div></div></div>
    <div class="note">O bot apresentará os profissionais disponíveis para o cliente escolher com quem será atendido.</div>
    <div class="dyn-list" id="teamList">${prof.map((p,i)=>`<div class="dyn-item"><div class="dyn-fields"><input placeholder="Nome do profissional" value="${p.n}" oninput="updProf(${i},'n',this.value)"/><input placeholder="Especialidade (Ex: Corte + Barba)" value="${p.s}" oninput="updProf(${i},'s',this.value)"/></div><button class="rm-btn" onclick="rmProf(${i})">×</button></div>`).join('')}</div>
    <button class="add-btn" onclick="addProf()">+ Adicionar profissional</button></div>`;
  }

  else if(stepName==='Serviços'){
    const isBarb=sel==='barbearia';
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:${t.bg}">${isBarb?'💈':'💊'}</div><div><div class="card-title">${isBarb?'Serviços e Preços':'Serviços e Convênios'}</div></div></div>
    <div class="f"><label class="fl">Serviços Oferecidos <span class="req">*</span></label><textarea rows="4" placeholder="${isBarb?'Ex: Corte masculino, Barba completa, Sobrancelha, Combo corte + barba, Progressiva...':'Ex: Limpeza dental, Clareamento, Implante, Canal, Ortodontia, Botox facial...'}" oninput="u('servicos',this.value)">${form.servicos}</textarea></div>
    <div class="f"><label class="fl">${isBarb?'Tabela de Preços':'Valores dos Procedimentos'} <span style="color:#9ca3af;font-weight:400">(opcional)</span></label><textarea rows="3" placeholder="${isBarb?'Ex:\nCorte — R$35\nBarba — R$25\nCombo corte + barba — R$55\nSobrancelha — R$15':'Ex:\nLimpeza dental — R$150\nClareamento — a partir de R$800\nConsulta avaliação — R$200'}" oninput="u('precos',this.value)">${form.precos}</textarea><div class="hint">O agente usará isso para informar os clientes sobre valores.</div></div>
    ${isBarb?'':`<div class="f"><label class="fl">Convênios Aceitos</label><input placeholder="Ex: Amil, Unimed, Bradesco Saúde — ou 'Somente particular'" value="${form.convenios}" oninput="u('convenios',this.value)"/></div>`}
    <div class="f"><label class="fl">Link do Cardápio / Menu de Serviços</label><input placeholder="Ex: https://linktr.ee/suaclinica ou link do Instagram" value="${form.linkCatalogServ}" oninput="u('linkCatalogServ',this.value)"/><div class="hint">Se tiver um link com seus serviços ou preços, o bot pode encaminhar diretamente.</div></div>
    <div class="f"><label class="fl">Formas de Pagamento</label><div class="chips">${PAGTOS.map(p=>`<div class="chip ${form.pagtos.includes(p)?'on':''}" onclick="toggleChip('pagtos','${p}')">${p}</div>`).join('')}</div></div>
    ${!isBarb?`<div class="f"><div class="tog ${form.priGrat?'on':''}" onclick="tv('priGrat')"><div class="tog-box"></div>Oferece primeira consulta gratuita</div></div>`:''}
    </div>`;
  }

  else if(stepName==='Produtos'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#f5f3ff">📦</div><div><div class="card-title">Sobre os Produtos</div></div></div>
    <div class="f"><label class="fl">Categorias Principais <span class="req">*</span></label><textarea rows="3" placeholder="Ex: Roupas femininas, Calçados esportivos, Acessórios, Bolsas de couro..." oninput="u('produtos',this.value)">${form.produtos}</textarea></div>
    <div class="f"><label class="fl">Produtos em Destaque / Mais Vendidos</label><textarea rows="3" placeholder="Liste os produtos que você mais vende. Inclua nome, descrição breve e preço se possível." oninput="u('destaque',this.value)">${form.destaque}</textarea></div>
    <div class="r2">
      <div class="f" style="margin-bottom:0"><label class="fl">Faixa de Preço</label><input placeholder="Ex: R$20 a R$500" value="${form.faixaPreco}" oninput="u('faixaPreco',this.value)"/></div>
      <div class="f" style="margin-bottom:0"><label class="fl">Como o Cliente Compra?</label><input placeholder="Ex: Link do site, WhatsApp" value="${form.comoCompra}" oninput="u('comoCompra',this.value)"/></div>
    </div></div>`;
  }

  else if(stepName==='Logística'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#f5f3ff">🚚</div><div><div class="card-title">Entrega e Logística</div></div></div>
    <div class="r2">
      <div class="f" style="margin-bottom:0"><label class="fl">Prazo de Entrega <span class="req">*</span></label><input placeholder="Ex: 3 a 7 dias úteis" value="${form.prazoEntrega}" oninput="u('prazoEntrega',this.value)"/></div>
      <div class="f" style="margin-bottom:0"><label class="fl">Frete Grátis Acima de</label><input placeholder="Ex: R$150" value="${form.freteGratis}" oninput="u('freteGratis',this.value)"/></div>
    </div>
    <div class="f" style="margin-top:15px"><label class="fl">Regiões Atendidas <span class="req">*</span></label><input placeholder="Ex: Todo o Brasil / Apenas SP e RJ / Sorocaba e região" value="${form.regioes}" oninput="u('regioes',this.value)"/></div>
    <div class="f"><label class="fl">Transportadoras / Formas de Envio</label><input placeholder="Ex: Correios PAC/SEDEX, Jadlog, retirada na loja" value="${form.transportadoras}" oninput="u('transportadoras',this.value)"/></div></div>`;
  }

  else if(stepName==='Pagamento'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#f5f3ff">💳</div><div><div class="card-title">Pagamento</div></div></div>
    <div class="f"><label class="fl">Formas Aceitas <span class="req">*</span></label><div class="chips">${PAGTOS.map(p=>`<div class="chip ${form.pagtos.includes(p)?'on':''}" onclick="toggleChip('pagtos','${p}')">${p}</div>`).join('')}</div></div>
    <div class="f"><label class="fl">Parcelamento no Cartão</label><input placeholder="Ex: até 6x sem juros / 12x com juros de 1,99%" value="${form.parcelamento}" oninput="u('parcelamento',this.value)"/></div>
    <div class="f"><div class="tog ${form.pixDesconto?'on':''}" onclick="tv('pixDesconto')"><div class="tog-box"></div>Oferece desconto para pagamento via PIX</div></div></div>`;
  }

  else if(stepName==='Políticas'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#f5f3ff">📋</div><div><div class="card-title">Políticas da Loja</div><div class="card-sub">O bot usará isso para responder dúvidas dos clientes</div></div></div>
    <div class="f"><label class="fl">Troca e Devolução <span class="req">*</span></label><textarea rows="2" placeholder="Ex: Aceitamos troca em até 7 dias corridos com produto sem uso, etiqueta e nota fiscal." oninput="u('politicaTroca',this.value)">${form.politicaTroca}</textarea></div>
    <div class="f"><label class="fl">Garantia dos Produtos</label><input placeholder="Ex: 90 dias de garantia contra defeito de fabricação." value="${form.garantia}" oninput="u('garantia',this.value)"/></div>
    <div class="f"><label class="fl">Cancelamento de Pedido</label><input placeholder="Ex: Pedidos podem ser cancelados em até 24h após a compra." value="${form.cancelamento}" oninput="u('cancelamento',this.value)"/></div></div>`;
  }

  else if(stepName==='Áreas'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#fffbeb">⚖️</div><div><div class="card-title">Áreas de Atuação</div></div></div>
    <div class="note warn"><b>Aviso importante:</b> O bot NÃO dará pareceres jurídicos. Ele informa as áreas de atuação e agenda a consulta inicial.</div>
    <div class="f"><label class="fl">Selecione as Áreas <span class="req">*</span></label><div class="chips">${AREAS.map(a=>`<div class="chip ${form.areasDir.includes(a)?'on':''}" onclick="toggleChip('areasDir','${a}')">${a}</div>`).join('')}</div></div>
    <div class="f"><label class="fl">Observações sobre os Serviços</label><textarea rows="3" placeholder="Ex: Atendemos apenas pessoas físicas. Fazemos consultoria online via Google Meet. Cobrança por hora de R$350." oninput="u('obsAreas',this.value)">${form.obsAreas}</textarea></div>
    <div class="f"><div class="tog ${form.consultaIni?'on':''}" onclick="tv('consultaIni')"><div class="tog-box"></div>Oferece consulta inicial gratuita</div></div></div>`;
  }

  else if(stepName==='Horários'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#f0f9ff">🕐</div><div><div class="card-title">Horários de Funcionamento</div></div></div>
    <div class="f"><label class="fl">Dias de Atendimento <span class="req">*</span></label><div class="chips">${DIAS_F.map((d,i)=>`<div class="chip ${form.dias.includes(d)?'on':''}" onclick="toggleChip('dias','${d}')">${DIAS_S[i]}</div>`).join('')}</div></div>
    <div class="r2">
      <div class="f" style="margin-bottom:0"><label class="fl">Abertura <span class="req">*</span></label><input type="time" value="${form.abr}" onchange="u('abr',this.value)"/></div>
      <div class="f" style="margin-bottom:0"><label class="fl">Fechamento <span class="req">*</span></label><input type="time" value="${form.fec}" onchange="u('fec',this.value)"/></div>
    </div>
    <div class="f" style="margin-top:15px"><label class="fl">Observações de Horário</label><textarea rows="2" placeholder="Ex: Sábado somente pela manhã até 13h. Fechado nos feriados municipais." oninput="u('obsHor',this.value)">${form.obsHor}</textarea></div></div>`;
  }

  else if(stepName==='Agendamento'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#f0fdf4">📅</div><div><div class="card-title">Agendamento Online</div><div class="card-sub">Integração com Cal.com (sistema de agenda)</div></div></div>
    <div class="note">O bot verificará horários disponíveis e criará agendamentos automaticamente no seu calendário, sem precisar de recepcionista.</div>
    <div class="f"><label class="fl">Cal.com API Key <span class="req">*</span></label>
      <div class="inpbtn"><input type="password" placeholder="cal_live_xxxxxxxxxxxxxxxx" value="${form.calKey}" oninput="u('calKey',this.value)"/><button class="sbtn" onclick="openM('api')">🔑 Tutorial</button></div>
    </div>
    <div class="f"><label class="fl">Event Type ID <span class="req">*</span></label>
      <div class="inpbtn"><input placeholder="Ex: 123456" value="${form.calEid}" oninput="u('calEid',this.value)"/><button class="sbtn" onclick="openM('eid')">🔍 Como achar</button></div>
      <div class="hint">ID numérico do tipo de atendimento criado no Cal.com.</div>
    </div>
    <div class="r2">
      <div class="f" style="margin-bottom:0"><label class="fl">Duração</label><select onchange="u('duracao',this.value)">${['15','20','30','45','60','90'].map(d=>`<option value="${d}" ${form.duracao===d?'selected':''}>${d} min</option>`).join('')}</select></div>
      <div class="f" style="margin-bottom:0"><label class="fl">Nome do Atendimento</label><input placeholder="${sel==='barbearia'?'Corte de Cabelo':sel==='advocacia'?'Consulta Inicial':'Consulta'}" value="${form.tipoConsulta}" oninput="u('tipoConsulta',this.value)"/></div>
    </div></div>`;
  }

  else if(stepName==='Agente'){
    const toms=sel==='advocacia'?['Profissional e formal','Sério e objetivo']:sel==='ecommerce'?['Consultivo e amigável','Animado e persuasivo','Neutro e objetivo']:sel==='barbearia'?['Descontraído e informal','Amigável e casual','Animado e divertido']:['Amigável e acolhedor','Profissional e formal','Neutro e objetivo'];
    const tipNome=sel==='barbearia'?'João, Pedro, Marcos':sel==='ecommerce'?'Luna, Clara, Bia':sel==='advocacia'?'Dra. Ana, Dr. Carlos':'Ana, Sofia, Maria';
    html=`<div class="card">
    <div class="card-hd"><div class="card-ic" style="background:#f0f9ff">🤖</div><div><div class="card-title">Configuração do Agente IA</div><div class="card-sub">Quanto mais detalhes, melhor o atendimento</div></div></div>

    <div class="slabel">IDENTIDADE</div>
    <div class="f"><label class="fl">Nome do Agente <span class="req">*</span></label><input placeholder="Ex: ${tipNome}" value="${form.nomeAg}" oninput="u('nomeAg',this.value)"/><div class="hint">Nome com que o bot vai se apresentar. Pode ser qualquer nome que combine com seu negócio.</div></div>
    <div class="f"><label class="fl">Tom de Voz <span class="req">*</span></label><select onchange="u('tom',this.value)">${toms.map(t=>`<option ${form.tom===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="f"><label class="fl">Mensagem de Boas-vindas</label><textarea rows="2" placeholder="Ex: Olá! Sou o assistente virtual da ${sel==='barbearia'?'Barbearia do João':'Clínica'}. Como posso te ajudar? 😊" oninput="u('boasvindas',this.value)">${form.boasvindas}</textarea><div class="hint">Se deixar em branco, geraremos uma automaticamente com base no seu negócio.</div></div>

    <div class="sdiv">
    <div class="slabel">POSICIONAMENTO</div>
    <div class="f"><label class="fl">O que diferencia seu negócio? <span class="req">*</span></label><textarea rows="3" placeholder="Ex: Somos os únicos da cidade com estacionamento gratuito. Atendemos por agendamento e por ordem de chegada. Nossos profissionais têm mais de 10 anos de experiência. Trabalhamos com produtos premium importados." oninput="u('diferencial',this.value)">${form.diferencial}</textarea><div class="hint">O agente usará isso para apresentar seu negócio de forma convincente e diferenciar de concorrentes.</div></div>
    <div class="f"><label class="fl">O que o agente NÃO deve fazer?</label><textarea rows="3" placeholder="Ex: Não informar preços por WhatsApp sem antes coletar o nome do cliente. Não marcar mais de um horário por cliente no mesmo dia. Não prometer descontos que não foram autorizados. Não dar pareceres médicos ou diagnósticos." oninput="u('naoFazer',this.value)">${form.naoFazer}</textarea><div class="hint">Muito importante — evita que o bot cometa erros ou faça promessas que seu negócio não pode cumprir.</div></div>
    <div class="f"><label class="fl">Instruções Especiais de Comportamento</label><textarea rows="3" placeholder="Ex: Sempre pergunte o nome antes de continuar. Para procedimentos acima de R$500, peça para o cliente ligar. Se o cliente mencionar dor ou urgência, priorize o agendamento mais próximo disponível." oninput="u('instrucoes',this.value)">${form.instrucoes}</textarea></div>
    </div>

    <div class="sdiv">
    <div class="slabel">TABELA DE PREÇOS / CATÁLOGO</div>
    <div class="f"><label class="fl">Tabela de Preços Completa</label><textarea rows="5" placeholder="Cole aqui sua tabela de preços, cardápio ou lista de serviços com valores. Pode ser em formato livre.&#10;&#10;Exemplo:&#10;CORTES&#10;Corte masculino — R$35&#10;Corte infantil (até 10 anos) — R$25&#10;&#10;BARBA&#10;Barba completa — R$30&#10;Aparar barba — R$20&#10;&#10;COMBOS&#10;Combo corte + barba — R$55" oninput="u('tabelaPrecos',this.value)">${form.tabelaPrecos}</textarea><div class="hint">Quanto mais detalhada, mais preciso o agente será ao responder dúvidas sobre preços.</div></div>
    <div class="f"><label class="fl">Link do Catálogo / Menu / Cardápio</label><input placeholder="Ex: https://linktr.ee/seulink, link do Instagram, site ou PDF" value="${form.linkCatalogo}" oninput="u('linkCatalogo',this.value)"/><div class="hint">O bot pode compartilhar este link quando o cliente pedir para ver produtos ou serviços.</div></div>
    </div>

    <div class="sdiv">
    <div class="slabel">PERGUNTAS FREQUENTES</div>
    <div class="note green"><b>💡 Dica de ouro:</b> Adicione as perguntas que seus clientes mais fazem. O agente vai responder com exatamente as suas palavras, reduzindo erros e aumentando a satisfação.</div>
    <div class="dyn-list">${faqs.map((fq,i)=>`<div class="dyn-item"><div class="dyn-fields"><div class="faq-pair"><div class="faq-label">PERGUNTA ${i+1}</div><input placeholder="Ex: Vocês aceitam Unimed?" value="${fq.q}" oninput="updFaq(${i},'q',this.value)" style="margin-bottom:6px"/><div class="faq-label">RESPOSTA</div><textarea rows="2" placeholder="Ex: Sim! Aceitamos Unimed, Amil e Bradesco Saúde. Para saber se seu plano cobre o procedimento desejado, basta nos informar o número do seu cartão." oninput="updFaq(${i},'a',this.value)" style="font-size:13px">${fq.a}</textarea></div></div><button class="rm-btn" onclick="rmFaq(${i})" style="margin-top:10px">×</button></div>`).join('')}</div>
    ${faqs.length<7?`<button class="add-btn" onclick="addFaq()">+ Adicionar pergunta frequente</button>`:'<div class="hint">Máximo de 7 perguntas atingido.</div>'}
    </div>

    ${sel!=='ecommerce'?`<div class="sdiv"><div class="slabel">ATENDIMENTO HUMANO</div><div class="f"><label class="fl">Palavras para Acionar a Equipe</label><input value="${form.palavrasHumano}" oninput="u('palavrasHumano',this.value)"/><div class="hint">Quando o cliente usar essas palavras, o bot pausará e avisará sua equipe para assumir a conversa.</div></div></div>`:''}
    </div>`;
  }

  else if(stepName==='Contato'){
    html=`<div class="card"><div class="card-hd"><div class="card-ic" style="background:#f4f4f5">👤</div><div><div class="card-title">Dados do Responsável</div><div class="card-sub">Para contato interno — não aparecem para os clientes</div></div></div>
    <div class="f"><label class="fl">Seu Nome Completo <span class="req">*</span></label><input placeholder="Nome completo" value="${form.respNome}" oninput="u('respNome',this.value)"/></div>
    <div class="f"><label class="fl">Seu WhatsApp <span class="req">*</span></label><input placeholder="5515999999999" value="${form.respWa}" oninput="u('respWa',this.value)"/></div>
    <div class="f"><label class="fl">Seu E-mail <span class="req">*</span></label><input type="email" placeholder="contato@seunegocio.com.br" value="${form.respEmail}" oninput="u('respEmail',this.value)"/></div>
    <div class="f"><label class="fl">Observações Finais</label><textarea rows="3" placeholder="Algum prazo, necessidade especial ou informação adicional que queira nos passar?" oninput="u('obsFinais',this.value)">${form.obsFinais}</textarea></div></div>`;
  }

  el.innerHTML=html;
}

function render(){renderProgress();renderContent();renderNav();}

function go(dir){
  const steps=sel?TYPES[sel].steps:[];
  if(dir===1&&step>=steps.length){submit();return;}
  if(dir===-1&&step<=1){sel=null;step=0;render();return;}
  step+=dir;render();window.scrollTo({top:0,behavior:'smooth'});
}

async function submit(){
  const btn=document.getElementById('btnN');btn.disabled=true;btn.textContent='⏳ Enviando...';
  const payload={tipo:sel,...form,equipe:prof,faq:faqs,timestamp:new Date().toISOString()};
  try{await fetch('https://n8n.servergrs.sbs/webhook/novo-cliente',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}catch(e){}
  setTimeout(()=>{
    document.querySelector('.wrap').innerHTML=`
      <div class="header"><div class="logo"><div class="logo-mark"><svg viewBox="0 0 22 22" fill="none"><circle cx="11" cy="8.5" r="3.5" stroke="white" stroke-width="1.6"/><path d="M3 19.5c0-4.142 3.582-7.5 8-7.5s8 3.358 8 7.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/><path d="M17.5 3.5L19 2M4.5 3.5L3 2M11 2.5V1" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg></div><div><span class="logo-name">GRS Automações</span><span class="logo-sub">Assistentes Virtuais para Negócios</span></div></div></div>
      <div class="suc"><div class="suc-ic">🎉</div><h2>Cadastro enviado!</h2>
      <p>Recebemos os dados de <strong>${form.nomeNeg||'seu negócio'}</strong>.<br/>Nossa equipe entrará em contato em até 24h para iniciar a configuração.</p>
      <div class="ns"><div class="ns-t">Próximos passos</div>
        <div class="ns-i"><div class="ns-n">1</div><span>Verificaremos seus dados e prepararemos o ambiente técnico</span></div>
        <div class="ns-i"><div class="ns-n">2</div><span>Você receberá orientações para criar e conectar o Cal.com (se aplicável)</span></div>
        <div class="ns-i"><div class="ns-n">3</div><span>Faremos um teste ao vivo com você antes de ativar o bot</span></div>
        <div class="ns-i"><div class="ns-n">4</div><span>Bot ativado — seus clientes atendidos 24h, 7 dias por semana 🚀</span></div>
      </div></div>`;
  },1500);
}

render();
</script>
</body>
</html>
